<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Ambient Device Visuals</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }

    #app,
    #canvas-holder {
      width: 100%;
      height: 100%;
    }

    #canvas-holder {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      width: 1024px;
      height: 600px;
    }

    #controls {
      display: none !important;
    }

    /* Exhibition: no cursor, selection, gestures or context menu on the touch display. */
    * {
      cursor: none !important;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }
  </style>
</head>

<body oncontextmenu="return false">
  <div id="app">
    <div id="canvas-holder"></div>
    <div id="controls"></div>
  </div>

  <script src="vendor/p5-2.3.1.min.js"></script>
  <script src="sketch.js?v=palette-20"></script>
  <script type="module" src="ambient-link-v1.mjs"></script>
</body>

</html>
