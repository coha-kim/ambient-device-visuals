<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Ambient Device Visuals</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }

    #app,
    #canvas-holder {
      width: 100%;
      height: 100%;
    }

    #canvas-holder {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      width: 1024px;
      height: 600px;
    }

    #controls {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="canvas-holder"></div>
    <div id="controls"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.1/lib/p5.min.js"></script>
  <script src="sketch.js?v=saturation-size-19"></script>
  <script type="module" src="ambient-link-v1.mjs"></script>
</body>

</html>
